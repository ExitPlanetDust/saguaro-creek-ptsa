# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main (i.e. every edit — via Pages CMS, the GitHub web
# editor, or git) and can be run by hand from the Actions tab.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ref: main — always build the latest commit, not the SHA snapshotted at
      # dispatch time; a refresh-triggered deploy can otherwise race the push
      # it was meant to publish and rebuild the previous commit.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # With a custom domain (Pages "cname" setting) the site serves from /;
      # otherwise project sites serve from /<repo-name>/ and user/org sites from /.
      - name: Set path prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.event.repository.name }}"
          CNAME="$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' 2>/dev/null || true)"
          if [[ -n "$CNAME" || "$REPO" == *.github.io ]]; then
            echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "PATH_PREFIX=/${REPO}/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
